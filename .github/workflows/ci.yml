name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned Simplex
        run: |
          curl -fsSL https://raw.githubusercontent.com/BlockstreamResearch/smplx/master/simplexup/simplexup -o "$RUNNER_TEMP/simplexup"
          SIMPLEX_DIR="$HOME/.simplex" bash "$RUNNER_TEMP/simplexup" -i v0.0.9
          echo "$HOME/.simplex/bin" >> "$GITHUB_PATH"
      - name: Pin Simplicity standard library
        run: |
          revision=53b06722830fd85150389976e6b28ea26cc037f7
          git init -q deps/simplicityhl-std
          git -C deps/simplicityhl-std fetch -q --depth 1 https://github.com/BlockstreamResearch/simplicityhl-std.git "$revision"
          git -C deps/simplicityhl-std checkout -q --detach FETCH_HEAD
          test "$(git -C deps/simplicityhl-std rev-parse HEAD)" = "$revision"
      - run: simplex build
      - run: git diff --exit-code -- crates/damp-signer/artifacts/simf
      - name: Reject missing or extra generated programs
        run: test -z "$(git status --porcelain --untracked-files=all -- crates/damp-signer/artifacts/simf)"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check -p simplicity-damp-signer --target wasm32-unknown-unknown

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@wasm-pack
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm wasm
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm --dir apps/web build

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm schema:test
