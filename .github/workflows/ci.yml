name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned Simplex
        run: |
          curl -fsSL https://raw.githubusercontent.com/BlockstreamResearch/smplx/master/simplexup/simplexup -o /tmp/simplexup
          chmod +x /tmp/simplexup
          SIMPLEX_DIR="$HOME/.simplex" /tmp/simplexup -i v0.0.9
          echo "$HOME/.simplex/bin" >> "$GITHUB_PATH"
      - run: ./scripts/prepare-simplex-std.sh
      - run: simplex build
      - run: ./scripts/check-contract-bundle.sh
      - run: ./scripts/check-generated-artifacts.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib --test protocol
      - run: cargo check -p simplicity-amp-signer --target wasm32-unknown-unknown

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned Simplex
        run: |
          curl -fsSL https://raw.githubusercontent.com/BlockstreamResearch/smplx/master/simplexup/simplexup -o /tmp/simplexup
          chmod +x /tmp/simplexup
          SIMPLEX_DIR="$HOME/.simplex" /tmp/simplexup -i v0.0.9
          echo "$HOME/.simplex/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@wasm-pack
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/prepare-simplex-std.sh
      - run: simplex build
      - run: ./scripts/check-contract-bundle.sh
      - run: ./scripts/check-generated-artifacts.sh
      - run: pnpm wasm
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm schema:test

  regtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Simplex
        run: |
          curl -fsSL https://raw.githubusercontent.com/BlockstreamResearch/smplx/master/simplexup/simplexup -o /tmp/simplexup
          chmod +x /tmp/simplexup
          SIMPLEX_DIR="$HOME/.simplex" /tmp/simplexup -i v0.0.9
          echo "$HOME/.simplex/bin" >> "$GITHUB_PATH"
      - run: ./scripts/prepare-simplex-std.sh
      - run: simplex build
      - run: ./scripts/test-regtest.sh
