name: GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned Simplex
        run: |
          curl -fsSL https://raw.githubusercontent.com/BlockstreamResearch/smplx/master/simplexup/simplexup -o /tmp/simplexup
          chmod +x /tmp/simplexup
          SIMPLEX_DIR="$HOME/.simplex" /tmp/simplexup -i v0.0.9
          echo "$HOME/.simplex/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@wasm-pack
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/prepare-simplex-std.sh
      - run: simplex build
      - run: ./scripts/check-contract-bundle.sh
      - run: ./scripts/check-generated-artifacts.sh
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
