[package]
name = "simplicity-amp"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
license = "MIT OR Apache-2.0"
description = "Asset management protocol covenants for Liquid"

[workspace]
members = ["crates/amp-core", "crates/amp-signer"]
resolver = "2"

[dependencies]
amp-core = { package = "simplicity-amp-core", path = "crates/amp-core" }
anyhow = "1.0.101"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
smplx-std = "0.0.8"

[dev-dependencies]
rand = "0.8.5"

[lints.clippy]
multiple_crate_versions = "allow"
