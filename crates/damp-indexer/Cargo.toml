[package]
name = "damp-indexer"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
license = "MIT OR Apache-2.0"
description = "Resumable public chain history for DAMP audit reports"

[dependencies]
damp-core = { package = "simplicity-damp-core", path = "../damp-core" }
damp-signer = { package = "simplicity-damp-signer", path = "../damp-signer" }
elements = { version = "0.25.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.19"
rusqlite = { version = "0.32.1", features = ["bundled"] }
fs2 = "0.4.3"
libc = "0.2"
rustix = { version = "1.1", features = ["process"] }
rand = "0.8.5"
hex = "0.4.3"
tempfile = "=3.25.0"
