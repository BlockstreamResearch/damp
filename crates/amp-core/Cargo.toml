[package]
name = "simplicity-amp-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
license = "MIT OR Apache-2.0"
description = "Canonical policy and registry model for Simplicity AMP"

[dependencies]
anyhow = "1.0.101"
hex = "0.4.3"
secp256k1-zkp = { version = "0.11.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[lints.clippy]
multiple_crate_versions = "allow"
