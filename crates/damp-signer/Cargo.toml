[package]
name = "simplicity-damp-signer"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
license = "MIT OR Apache-2.0"
description = "Standalone Rust and WebAssembly signer SDK for Simplicity DAMP"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0.145"
zeroize = "1.9.0"
damp-core = { package = "simplicity-damp-core", path = "../damp-core" }
anyhow = "1.0.101"
thiserror = "2.0.19"
elements = { version = "0.25.3", features = ["base64", "serde"] }
elements-miniscript = { version = "0.4.0", default-features = false }
getrandom = { version = "0.2.16", features = ["js"] }
hex = "0.4.3"
lwk_common = { version = "0.19.0", default-features = false }
lwk_signer = { version = "0.19.0", default-features = false }
rand = "0.8.5"
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
sha2 = "0.10.9"
simplicityhl = { version = "0.6.0", default-features = false }
tempfile = "=3.25.0"
wasm-bindgen = "0.2.104"

[lints.clippy]
multiple_crate_versions = "allow"
