[package]
name = "simplicity-damp-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
license = "MIT OR Apache-2.0"
description = "Canonical policy and registry model for Simplicity DAMP"

[dependencies]
aes-gcm-siv = "0.11.1"
num-bigint = "0.4.6"
rand = "0.8.5"
anyhow = "1.0.101"
hex = "0.4.3"
secp256k1-zkp = { version = "0.11.0", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
zeroize = "1.9.0"
thiserror = "2.0.19"

[dev-dependencies]
tempfile = "3.25.0"

[lints.clippy]
multiple_crate_versions = "allow"
